name: Go checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go mod tidy
      - run: gofmt -w cmd
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/server ./cmd/client
